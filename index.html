<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Expense Tracker</title>
<style>
  :root{
    --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--ink:#e8eaed;--muted:#9aa3b2;
    --accent:#6ea8fe;--accent2:#4f7ce0;--paid:#2ea36b;--paidbg:#12291f;--part:#e0b23a;--partbg:#2b2610;--pend:#d0863a;--pendbg:#2b2013;--danger:#e5484d;--chip:#242a35;
    --c-int:#6ea8fe;--c-kit:#c58af9;--c-fur:#4fd1c5;--c-rent:#e5883a;--c-app:#e35d8a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  header{background:linear-gradient(180deg,#1a1e27,#141821);border-bottom:1px solid var(--line);padding:14px 16px;position:sticky;top:0;z-index:20}
  .title{font-size:20px;font-weight:bold}
  .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  input,button,select{font-family:inherit;font-size:13px}
  .who{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;min-width:140px}
  button{background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:bold}
  button.primary:hover{background:var(--accent)}
  button.danger{color:#ffb4b6}button.danger:hover{border-color:var(--danger)}
  .wrap{max-width:1080px;margin:0 auto;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:8px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
  .stat .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .stat .val{font-size:22px;font-weight:bold;margin-top:6px}
  .stat.paid .val{color:var(--paid)}.stat.pend .val{color:var(--pend)}
  .bar{height:8px;border-radius:6px;background:var(--panel);overflow:hidden;margin-top:12px;display:flex}
  .bar>span{display:block;height:100%}
  .catwrap{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0}
  .catrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .catrow .nm{min-width:130px;font-weight:bold}
  .catrow .track{flex:1;height:9px;background:var(--panel);border-radius:6px;overflow:hidden;min-width:60px}
  .catrow .track>span{display:block;height:100%}
  .catrow .amt{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;font-size:12px}
  .filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:16px 0 8px}
  .fbtn{padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:var(--panel2);color:var(--muted);cursor:pointer;font-size:12px}
  .fbtn.active{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:bold}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 8px;border-bottom:1px solid var(--line)}
  th.num,td.num{text-align:right}
  td{padding:3px 6px;border-bottom:1px solid #22262f;vertical-align:middle}
  .cell{background:transparent;border:1px solid transparent;color:var(--ink);border-radius:6px;padding:7px 8px;width:100%}
  .cell:hover{border-color:var(--line)}.cell:focus{border-color:var(--accent);background:var(--panel);outline:none}
  .cell.num{text-align:right;font-variant-numeric:tabular-nums}
  select.cell{cursor:pointer}
  .catpill{display:inline-flex;align-items:center;gap:6px}
  .status{border-radius:20px;padding:5px 11px;border:1px solid var(--line);font-weight:bold;font-size:12px;white-space:nowrap;display:inline-block;text-align:center}
  .status.Paid{background:var(--paidbg);color:var(--paid);border-color:#1f5c3f}
  .status.Partial{background:var(--partbg);color:var(--part);border-color:#5c5320}
  .status.Pending{background:var(--pendbg);color:var(--pend);border-color:#5c4620}
  .remain{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
  .rowbtn{opacity:.4;padding:4px 8px;font-size:13px}tr:hover .rowbtn{opacity:1}
  .totalrow td{font-weight:bold;border-top:2px solid var(--line);padding-top:10px}
  .addrow{margin:12px 0 4px}.addrow button{color:var(--muted)}
  .flash{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent2);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .3s;z-index:50}.flash.show{opacity:1}
  .note{background:#1b2330;border:1px solid #2b3a52;color:#b9cdf0;border-radius:8px;padding:10px 12px;font-size:12px;margin:16px 0 4px}
  .empty{color:var(--muted);padding:24px;text-align:center}
  /* mobile card list (hidden on desktop) */
  .cards{display:none}
  .pcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .pcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
  .pcard .fld{margin-bottom:10px}
  .pcard .fld label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
  .pcard .cell{background:var(--panel);border:1px solid var(--line)}
  .pcard .two{display:flex;gap:10px}.pcard .two>div{flex:1}
  #lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center}
  .lockbox{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:30px;width:320px;max-width:90vw;text-align:center}
  .lockbox h1{font-size:18px;margin:0 0 4px}.lockbox p{color:var(--muted);font-size:12px;margin:0 0 18px}
  .lockbox input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:11px;margin-bottom:10px;text-align:center}
  .lockbox button{width:100%}.lockerr{color:var(--danger);font-size:12px;height:16px;margin-top:6px}
  @media(max-width:760px){
    .desktop-table{display:none}
    .cards{display:block}
    .title{font-size:18px}
    .stat .val{font-size:20px}
    button,.who{padding:9px 12px}
    .catrow .nm{min-width:110px}
  }
</style>
</head>
<body>

<div id="lock"><div class="lockbox">
  <h1>&#128274; Home Expense Tracker</h1>
  <p>Enter the shared passcode to continue.</p>
  <input id="pass" type="password" placeholder="Passcode" onkeydown="if(event.key==='Enter')unlock()">
  <button class="primary" onclick="unlock()">Unlock</button>
  <div class="lockerr" id="lockerr"></div>
</div></div>

<header>
  <div class="title">&#127968; Home Expense Tracker</div>
  <div class="sub">Every payment in one place &middot; partial payments &middot; edits saved in your browser</div>
  <div class="toolbar">
    <input id="who" class="who" placeholder="Your name (for log)">
    <button class="primary" onclick="save()">&#128190; Save</button>
    <button onclick="doExport()">&#11015;&#65039; Export</button>
    <button onclick="document.getElementById('imp').click()">&#11014;&#65039; Import</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="doImport(event)">
    <button onclick="showLog()">&#128339; Log</button>
    <button onclick="window.print()">&#128424;&#65039; Print</button>
    <span style="flex:1"></span>
    <button class="danger" onclick="clearAll()">Clear all</button>
    <button class="danger" onclick="lock()">Lock</button>
  </div>
</header>

<div class="wrap" id="app"></div>
<div class="flash" id="flash"></div>

<script>
var PASSCODE="Shree";
var RS=function(n){return '\u20B9'+(Math.round(+n||0)).toLocaleString('en-IN');};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso){if(!iso)return '';var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso);if(!m)return iso;return m[3]+'-'+MON[(+m[2])-1]+'-'+m[1];}
function parseDate(str){str=(str||'').trim();var m=/^(\d{1,2})[- \/]([A-Za-z]{3,})[- \/](\d{4})$/.exec(str);if(m){var mi=-1;for(var j=0;j<12;j++){if(MON[j].toLowerCase()===m[2].slice(0,3).toLowerCase()){mi=j;break;}}if(mi>=0)return m[3]+'-'+String(mi+1).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');}m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(str);if(m)return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');return str;}

var CATS=[
  {id:'Interior Work',color:'var(--c-int)'},
  {id:'Kitchen',color:'var(--c-kit)'},
  {id:'Furniture & Items',color:'var(--c-fur)'},
  {id:'Rented Flat',color:'var(--c-rent)'},
  {id:'Appliances',color:'var(--c-app)'}
];
function catColor(c){for(var i=0;i<CATS.length;i++)if(CATS[i].id===c)return CATS[i].color;return 'var(--muted)';}

/* each row: cat, item, amt (total), paid (paid so far), date */
function statusOf(r){var p=+r.paid||0,a=+r.amt||0;if(p<=0)return 'Pending';if(p>=a)return 'Paid';return 'Partial';}
function remainOf(r){return Math.max(0,(+r.amt||0)-(+r.paid||0));}

function seed(){return[
  {cat:'Interior Work',item:'Interior work \u2013 advance (68.89%)',amt:475000,paid:475000,date:'2026-05-15'},
  {cat:'Interior Work',item:'Interior work \u2013 after 50% done (25%)',amt:180000,paid:180000,date:'2026-05-29'},
  {cat:'Interior Work',item:'Interior work \u2013 final (5%)',amt:34504,paid:0,date:'2026-06-15'},
  {cat:'Kitchen',item:'Kitchen \u2013 60% to start work',amt:360000,paid:0,date:'2026-07-03'},
  {cat:'Kitchen',item:'Kitchen \u2013 35% at 50% complete',amt:210000,paid:0,date:'2026-07-31'},
  {cat:'Kitchen',item:'Kitchen \u2013 5% on completion',amt:30000,paid:0,date:'2026-08-31'},
  {cat:'Furniture & Items',item:'Sofa (advance + 2nd)',amt:70000,paid:35000,date:'2026-06-01'},
  {cat:'Furniture & Items',item:'Sofa cushion',amt:25000,paid:0,date:'2026-06-20'},
  {cat:'Furniture & Items',item:'Temple',amt:66500,paid:0,date:'2026-06-30'},
  {cat:'Furniture & Items',item:'Table',amt:21500,paid:0,date:'2026-06-30'},
  {cat:'Furniture & Items',item:'Bed mattress',amt:30000,paid:0,date:'2026-06-25'},
  {cat:'Rented Flat',item:'Rented flat \u2013 one month',amt:22000,paid:0,date:'2026-06-20'},
  {cat:'Appliances',item:'Air conditioner',amt:15000,paid:0,date:'2026-07-10'},
  {cat:'Appliances',item:'Home theater',amt:3000,paid:0,date:'2026-07-10'}
];}

var STORE='home_expense_tracker_v2',LOGK='home_expense_log_v2';
function load(){try{var s=localStorage.getItem(STORE);if(s)return JSON.parse(s);}catch(e){}return seed();}
var rows=load();
var log=JSON.parse(localStorage.getItem(LOGK)||'[]');
var filterCat='All',filterStatus='All',viewLog=false;
document.getElementById('who').value=localStorage.getItem('het_who')||'';

function persist(){localStorage.setItem(STORE,JSON.stringify(rows));localStorage.setItem(LOGK,JSON.stringify(log));}
function save(){persist();flash('Saved \u2713');}
function who(){var w=document.getElementById('who').value.trim()||'Someone';localStorage.setItem('het_who',w);return w;}
function record(what){log.unshift({who:who(),what:what,when:new Date().toISOString()});if(log.length>500)log.length=500;persist();}

function unlock(){var v=document.getElementById('pass').value;if(v===PASSCODE){sessionStorage.setItem('het_unlocked','1');document.getElementById('lock').style.display='none';render();}else{document.getElementById('lockerr').textContent='Incorrect passcode';}}
function lock(){sessionStorage.removeItem('het_unlocked');document.getElementById('lock').style.display='flex';document.getElementById('pass').value='';document.getElementById('lockerr').textContent='';}
if(sessionStorage.getItem('het_unlocked')==='1')document.getElementById('lock').style.display='none';

function edit(i,field,el){
  var raw;if(field==='amt'||field==='paid')raw=(+el.value.replace(/[^0-9.-]/g,'')||0);else if(field==='date')raw=parseDate(el.value);else raw=el.value;
  var old=rows[i][field];if(String(old)===String(raw))return;
  if(field==='paid'){var a=+rows[i].amt||0;if(raw>a)raw=a;if(raw<0)raw=0;}
  rows[i][field]=raw;
  var disp=(field==='amt'||field==='paid')?RS(old)+' \u2192 '+RS(raw):field==='date'?('"'+fmtDate(old)+'" \u2192 "'+fmtDate(raw)+'"'):('"'+old+'" \u2192 "'+raw+'"');
  var fl=field==='paid'?'paid-so-far':field;
  record('changed '+fl+' of "'+rows[i].item+'" \u2014 '+disp);persist();render();
}
function markPaid(i){rows[i].paid=+rows[i].amt||0;record('marked "'+rows[i].item+'" fully Paid ('+RS(rows[i].paid)+')');persist();render();}
function markUnpaid(i){rows[i].paid=0;record('reset "'+rows[i].item+'" to Pending');persist();render();}
function addRow(){rows.push({cat:filterCat!=='All'?filterCat:'Interior Work',item:'New payment',amt:0,paid:0,date:''});record('added a new payment');persist();render();}
function delRow(i){record('deleted "'+rows[i].item+'"');rows.splice(i,1);persist();render();}
function clearAll(){if(!confirm('Delete ALL rows and start with a blank tracker? The change log is kept.'))return;rows=[];record('cleared all rows');persist();render();flash('Cleared');}

function sumTot(a){return a.reduce(function(x,r){return x+(+r.amt||0);},0);}
function sumPaid(a){return a.reduce(function(x,r){return x+Math.min(+r.paid||0,+r.amt||0);},0);}
function flash(m){var f=document.getElementById('flash');f.textContent=m;f.classList.add('show');setTimeout(function(){f.classList.remove('show');},1500);}
function doExport(){var blob=new Blob([JSON.stringify({rows:rows,log:log,exportedBy:who(),at:new Date().toISOString()},null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='home-expenses-'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function doImport(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(o.rows){rows=o.rows.map(function(x){if(x.paid===undefined)x.paid=(x.status==='Paid')?(+x.amt||0):0;return x;});if(o.log)log=o.log.concat(log);record('imported data from a file');persist();render();flash('Imported \u2713');}else alert('Unrecognised file.');}catch(err){alert('Could not read that file.');}};r.readAsText(f);e.target.value='';}
function showLog(){viewLog=!viewLog;render();}

function statusPill(i){var r=rows[i],st=statusOf(r);
  return '<span class="status '+st+'">'+st+'</span>';}

function quickBtns(i){var r=rows[i],st=statusOf(r);
  if(st==='Paid')return '<button class="rowbtn" onclick="markUnpaid('+i+')" title="Reset to pending">&#8635;</button>';
  return '<button class="rowbtn" onclick="markPaid('+i+')" title="Mark fully paid">&#10003;</button>';
}

function render(){
  var app=document.getElementById('app');
  if(viewLog){
    app.innerHTML='<div class="note">Change history, stored in <b>this browser only</b>. <a href="#" onclick="showLog();return false" style="color:var(--accent)">&larr; back to tracker</a></div>'+
      (log.length?log.map(function(e){return '<div style="padding:9px 4px;border-bottom:1px solid #22262f;font-size:13px"><span style="color:var(--muted);font-size:11px">'+fmtDate(e.when.slice(0,10))+' '+new Date(e.when).toLocaleTimeString()+'</span> &nbsp; <b style="color:var(--accent)">'+e.who+'</b> '+e.what+'</div>';}).join(''):'<div class="empty">No changes yet.</div>');
    return;
  }
  var total=sumTot(rows),paid=sumPaid(rows),owed=total-paid;
  var pct=total?Math.round(paid/total*100):0;

  var s='<div class="grid">'+
    '<div class="stat"><div class="lbl">Total Cost</div><div class="val">'+RS(total)+'</div></div>'+
    '<div class="stat paid"><div class="lbl">Paid so far</div><div class="val">'+RS(paid)+'</div></div>'+
    '<div class="stat pend"><div class="lbl">Still Owed</div><div class="val">'+RS(owed)+'</div></div>'+
    '<div class="stat"><div class="lbl">Progress</div><div class="val">'+pct+'%</div>'+
      '<div class="bar"><span style="width:'+pct+'%;background:var(--paid)"></span><span style="width:'+(100-pct)+'%;background:var(--pendbg)"></span></div></div>'+
    '</div>';

  s+='<div class="catwrap"><div style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">By Category (paid vs total)</div>';
  CATS.forEach(function(c){
    var cr=rows.filter(function(r){return r.cat===c.id;});if(!cr.length)return;
    var ct=sumTot(cr),cp=sumPaid(cr),cpct=ct?Math.round(cp/ct*100):0;
    s+='<div class="catrow"><span class="dot" style="background:'+c.color+'"></span><span class="nm">'+c.id+'</span>'+
       '<span class="track"><span style="width:'+cpct+'%;background:'+c.color+'"></span></span>'+
       '<span class="amt">'+RS(cp)+' / '+RS(ct)+'</span></div>';
  });
  s+='</div>';

  s+='<div class="filters"><span style="color:var(--muted);font-size:11px;margin-right:4px">CATEGORY:</span>'+
     ['All'].concat(CATS.map(function(c){return c.id;})).map(function(c){return '<span class="fbtn '+(filterCat===c?'active':'')+'" onclick="filterCat=\''+c.replace(/'/g,"\\'")+'\';render()">'+c+'</span>';}).join('')+'</div>';
  s+='<div class="filters"><span style="color:var(--muted);font-size:11px;margin-right:4px">STATUS:</span>'+
     ['All','Paid','Partial','Pending'].map(function(st){return '<span class="fbtn '+(filterStatus===st?'active':'')+'" onclick="filterStatus=\''+st+'\';render()">'+st+'</span>';}).join('')+'</div>';

  var idx=rows.map(function(r,i){return i;}).filter(function(i){return (filterCat==='All'||rows[i].cat===filterCat)&&(filterStatus==='All'||statusOf(rows[i])===filterStatus);});
  idx.sort(function(a,b){return (rows[a].date||'').localeCompare(rows[b].date||'');});

  /* ---- desktop table ---- */
  var t='<div class="desktop-table"><table><tr><th>Category</th><th>Item</th><th>Date</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Remaining</th><th>Status</th><th></th></tr>';
  if(!idx.length) t+='<tr><td colspan="8"><div class="empty">No payments match this filter.</div></td></tr>';
  idx.forEach(function(i){
    var r=rows[i];var opts=CATS.map(function(c){return '<option '+(c.id===r.cat?'selected':'')+'>'+c.id+'</option>';}).join('');
    t+='<tr>'+
      '<td><span class="catpill"><span class="dot" style="background:'+catColor(r.cat)+'"></span><select class="cell" onchange="edit('+i+',\'cat\',this)">'+opts+'</select></span></td>'+
      '<td><input class="cell" value="'+(r.item||'').replace(/"/g,'&quot;')+'" onchange="edit('+i+',\'item\',this)"></td>'+
      '<td><input class="cell" style="min-width:105px" value="'+fmtDate(r.date)+'" placeholder="dd-mmm-yyyy" onchange="edit('+i+',\'date\',this)"></td>'+
      '<td class="num"><input class="cell num" value="'+r.amt+'" onchange="edit('+i+',\'amt\',this)"></td>'+
      '<td class="num"><input class="cell num" value="'+(r.paid||0)+'" onchange="edit('+i+',\'paid\',this)"></td>'+
      '<td class="num" style="color:var(--muted)">'+RS(remainOf(r))+'</td>'+
      '<td>'+statusPill(i)+'</td>'+
      '<td style="white-space:nowrap">'+quickBtns(i)+'<button class="rowbtn danger" onclick="delRow('+i+')">\u2715</button></td></tr>';
  });
  var ft=sumTot(idx.map(function(i){return rows[i];})),fp=sumPaid(idx.map(function(i){return rows[i];}));
  t+='<tr class="totalrow"><td></td><td>Showing '+idx.length+' item(s)</td><td></td><td class="num">'+RS(ft)+'</td><td class="num">'+RS(fp)+'</td><td class="num">'+RS(ft-fp)+'</td><td></td><td></td></tr>';
  t+='</table></div>';

  /* ---- mobile cards ---- */
  var m='<div class="cards">';
  if(!idx.length) m+='<div class="empty">No payments match this filter.</div>';
  idx.forEach(function(i){
    var r=rows[i];var opts=CATS.map(function(c){return '<option '+(c.id===r.cat?'selected':'')+'>'+c.id+'</option>';}).join('');
    m+='<div class="pcard">'+
      '<div class="top"><div style="flex:1"><span class="catpill"><span class="dot" style="background:'+catColor(r.cat)+'"></span><span style="font-size:11px;color:var(--muted)">'+r.cat+'</span></span></div>'+statusPill(i)+'</div>'+
      '<div class="fld"><label>Item</label><input class="cell" value="'+(r.item||'').replace(/"/g,'&quot;')+'" onchange="edit('+i+',\'item\',this)"></div>'+
      '<div class="two"><div class="fld"><label>Category</label><select class="cell" onchange="edit('+i+',\'cat\',this)">'+opts+'</select></div>'+
        '<div class="fld"><label>Date</label><input class="cell" value="'+fmtDate(r.date)+'" placeholder="dd-mmm-yyyy" onchange="edit('+i+',\'date\',this)"></div></div>'+
      '<div class="two"><div class="fld"><label>Total</label><input class="cell num" value="'+r.amt+'" onchange="edit('+i+',\'amt\',this)"></div>'+
        '<div class="fld"><label>Paid so far</label><input class="cell num" value="'+(r.paid||0)+'" onchange="edit('+i+',\'paid\',this)"></div></div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">'+
        '<span class="remain">Remaining: <b style="color:var(--ink)">'+RS(remainOf(r))+'</b></span>'+
        '<span>'+quickBtns(i)+'<button class="rowbtn danger" onclick="delRow('+i+')">\u2715 delete</button></span></div>'+
      '</div>';
  });
  m+='</div>';

  s+=t+m+'<div class="addrow"><button onclick="addRow()">+ Add payment</button></div>';
  s+='<div class="note">Type how much you\u2019ve <b>Paid so far</b> \u2014 remaining and status (Paid / Partial / Pending) update automatically, and the dashboard counts the actual amount paid. Tap &#10003; to mark a row fully paid. Dates read as dd-mmm-yyyy. Passcode-gate is cosmetic on a static site.</div>';

  app.innerHTML=s;
}
render();
</script>
</body>
</html>
