<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Expense Tracker</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('het_theme')||'dark');}catch(e){}</script>
<style>
  :root{
    --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--ink:#e8eaed;--muted:#9aa3b2;
    --accent:#6ea8fe;--accent2:#4f7ce0;--paid:#2ea36b;--paidbg:#12291f;--part:#e0b23a;--partbg:#2b2610;--pend:#d0863a;--pendbg:#2b2013;--danger:#e5484d;--chip:#242a35;
    --hdr1:#1a1e27;--hdr2:#141821;--rowline:#22262f;--noteBg:#1b2330;--noteLine:#2b3a52;--noteInk:#b9cdf0;
    --paidLine:#1f5c3f;--partLine:#5c5320;--pendLine:#5c4620;
  }
  html[data-theme="light"]{
    --bg:#f4f6fa;--panel:#ffffff;--panel2:#ffffff;--line:#d9dee7;--ink:#1c2430;--muted:#5f6b7c;
    --accent:#2f6fed;--accent2:#2f6fed;--paid:#1a8a52;--paidbg:#e5f5ec;--part:#a9791a;--partbg:#faf1d8;--pend:#b8631f;--pendbg:#fbeada;--danger:#d33;--chip:#eef1f6;
    --hdr1:#ffffff;--hdr2:#f0f3f8;--rowline:#eaecf1;--noteBg:#eaf1ff;--noteLine:#c5d8f5;--noteInk:#2f5aa8;
    --paidLine:#9bd7b4;--partLine:#e3cf8a;--pendLine:#e6bf95;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  header{background:linear-gradient(180deg,var(--hdr1),var(--hdr2));border-bottom:1px solid var(--line);padding:14px 16px;position:sticky;top:0;z-index:20}
  .title{font-size:20px;font-weight:bold}
  .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  input,button,select{font-family:inherit;font-size:13px}
  .who{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;min-width:130px}
  .budgetsel{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;min-width:150px;font-weight:bold}
  button{background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:bold}
  button.primary:hover{background:var(--accent)}
  button.danger{color:#ffb4b6}button.danger:hover{border-color:var(--danger)}
  .wrap{max-width:1180px;margin:0 auto;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:8px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
  .stat .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .stat .val{font-size:22px;font-weight:bold;margin-top:6px}
  .stat.paid .val{color:var(--paid)}.stat.pend .val{color:var(--pend)}
  .bar{height:8px;border-radius:6px;background:var(--panel);overflow:hidden;margin-top:12px;display:flex}
  .bar>span{display:block;height:100%}
  .catwrap{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0}
  .catrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .catrow .nm{min-width:130px;font-weight:bold}
  .catrow .track{flex:1;height:9px;background:var(--panel);border-radius:6px;overflow:hidden;min-width:60px}
  .catrow .track>span{display:block;height:100%}
  .catrow .amt{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;font-size:12px}
  .filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:16px 0 8px}
  .fbtn{padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:var(--panel2);color:var(--muted);cursor:pointer;font-size:12px}
  .fbtn.active{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:bold}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th{position:relative;text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 8px;border-bottom:1px solid var(--line);overflow:hidden}
  th.num,td.num{text-align:right}
  td{padding:3px 6px;border-bottom:1px solid var(--rowline);vertical-align:middle;overflow:hidden}
  .resizer{position:absolute;right:0;top:0;width:8px;height:100%;cursor:col-resize;user-select:none}
  .resizer:hover{background:var(--accent)}
  .cell{background:transparent;border:1px solid transparent;color:var(--ink);border-radius:6px;padding:7px 8px;width:100%}
  .cell:hover{border-color:var(--line)}.cell:focus{border-color:var(--accent);background:var(--panel);outline:none}
  .cell.num{text-align:right;font-variant-numeric:tabular-nums}
  select.cell{cursor:pointer}
  .moneywrap{position:relative;display:block}
  .moneywrap::before{content:'\20B9';position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none}
  .moneywrap .cell{padding-left:20px}
  .catpill{display:inline-flex;align-items:center;gap:6px}
  .status{border-radius:20px;padding:5px 11px;border:1px solid var(--line);font-weight:bold;font-size:12px;white-space:nowrap;display:inline-block;text-align:center}
  .status.Paid{background:var(--paidbg);color:var(--paid);border-color:var(--paidLine)}
  .status.Partial{background:var(--partbg);color:var(--part);border-color:var(--partLine)}
  .status.Pending{background:var(--pendbg);color:var(--pend);border-color:var(--pendLine)}
  .inst{font-size:11px;color:var(--part);white-space:nowrap;margin-top:3px}
  .instbtns button{padding:2px 8px;font-size:13px;margin:0 1px}
  .rowbtn{opacity:.45;padding:4px 8px;font-size:13px}tr:hover .rowbtn{opacity:1}
  .totalrow td{font-weight:bold;border-top:2px solid var(--line);padding-top:10px}
  .addrow{margin:12px 0 4px;display:flex;gap:8px;flex-wrap:wrap}.addrow button{color:var(--muted)}
  .flash{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent2);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .3s;z-index:50}.flash.show{opacity:1}
  .note{background:var(--noteBg);border:1px solid var(--noteLine);color:var(--noteInk);border-radius:8px;padding:10px 12px;font-size:12px;margin:16px 0 4px}
  .empty{color:var(--muted);padding:24px;text-align:center}
  .cards{display:none}
  .pcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  /* mobile two-line status rows */
  .mrows{display:none}
  .mrow{border-bottom:2px solid var(--bg)}
  .mrow:last-child{border-bottom:none}
  .mrowhead{padding:10px 12px;cursor:pointer;border-left:4px solid transparent}
  .mrow.Paid .mrowhead{background:var(--paidbg);border-left-color:var(--paid)}
  .mrow.Partial .mrowhead{background:var(--partbg);border-left-color:var(--part)}
  .mrow.Pending .mrowhead{background:var(--pendbg);border-left-color:var(--pend)}
  .mrowtop{display:flex;align-items:center;gap:8px}
  .mrowtop .nm{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrownums{font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums;opacity:.9}
  .mrownums b{font-weight:bold}
  .mrow.Paid .mrownums{color:var(--paid)} .mrow.Partial .mrownums{color:var(--part)} .mrow.Pending .mrownums{color:var(--pend)}
  .mrowedit{padding:12px;background:var(--panel);border-top:1px dashed var(--line)}
  .mrowedit .two{display:flex;gap:10px;margin-bottom:8px}.mrowedit .two>div{flex:1}
  .mrowedit label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
  .mrowedit .cell{background:var(--panel2);border:1px solid var(--line)}
  /* desktop table rows colored by status */
  tr.strow td:first-child{border-left:4px solid transparent}
  tr.strow.Paid{background:var(--paidbg)} tr.strow.Paid td:first-child{border-left-color:var(--paid)}
  tr.strow.Partial{background:var(--partbg)} tr.strow.Partial td:first-child{border-left-color:var(--part)}
  tr.strow.Pending{background:var(--pendbg)} tr.strow.Pending td:first-child{border-left-color:var(--pend)}
  tr.strow .cell{background:transparent}
  tr.strow .cell:hover{background:var(--panel)}
  /* clear separation between item rows */
  tr.strow td{border-bottom:2px solid var(--bg)}
  tr.strow:hover td{background:rgba(255,255,255,.04)}
  .ctbl tr.strow td,table tr.strow td{box-shadow:inset 0 -1px 0 var(--line)}
  .pcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
  .pcard .fld{margin-bottom:10px}
  .pcard .fld label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
  .pcard .cell{background:var(--panel);border:1px solid var(--line)}
  .pcard .two{display:flex;gap:10px}.pcard .two>div{flex:1}
  .instbox{background:var(--partbg);border:1px solid var(--partLine);border-radius:8px;padding:10px;margin:8px 0}
  .bcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .bhead{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
  .bhead:hover{background:var(--panel)}
  .caret{color:var(--muted);font-size:11px;width:14px}
  .bname{font-weight:bold;font-size:15px}
  .bcount{color:var(--muted);font-size:11px;background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
  .bmini .track{height:9px;background:var(--panel);border-radius:6px;overflow:hidden;display:inline-block}
  .bmini .track>span{display:block;height:100%}
  .bamt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap;min-width:130px;text-align:right}
  .bbody{padding:4px 16px 14px;border-top:1px solid var(--line)}
  .bcardstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 14px}
  .loanbadge{font-size:10px;font-weight:bold;color:var(--part);background:var(--partbg);border:1px solid var(--partLine);border-radius:20px;padding:2px 9px;text-transform:uppercase;letter-spacing:.5px}
  .loancard{border-color:var(--partLine)}
  .loancard .bhead{background:linear-gradient(90deg,var(--partbg),transparent)}
  .bcardact{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap}
  .bcardact button{flex:1;min-width:120px}
  .bcardstats .stat{padding:10px 12px}
  .bcardstats .stat .val{font-size:17px;margin-top:3px}
  @media(max-width:820px){.bcardstats{grid-template-columns:repeat(2,1fr)}}
  .bbody .pcard{background:var(--panel);}
  .ctbl{width:100%;border-collapse:collapse;font-size:13px}
  .ctbl th{padding:6px 6px;font-size:10px}
  .ctbl td{padding:2px 5px}
  .ctbl tr[draggable=true]{cursor:grab}
  .ctbl tr[draggable=true]:active{cursor:grabbing}
  .draghandle{color:var(--muted);white-space:nowrap;font-size:12px}
  .ctbl .cell{padding:5px 7px}
  /* view-only mode: hide edit affordances */
  body.viewonly .editonly{display:none !important}
  body.viewonly .cell{pointer-events:none;border-color:transparent !important;background:transparent !important;-webkit-appearance:none;appearance:none}
  body.viewonly select.cell{opacity:1}
  body.viewonly .status{cursor:default}
  body.viewonly .rowbtn,body.viewonly .instbtns,body.viewonly .resizer,body.viewonly .draghandle,body.viewonly .moneywrap input{pointer-events:none}
  body.viewonly .fbtn.addcat{display:none}
  body.viewonly tr[draggable=true]{cursor:default}
  @media(max-width:820px){.bmini{display:none}.bamt{min-width:0}}
  .instbox .lbl{color:var(--part);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;font-weight:bold}
  #lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center}
  .lockbox{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:30px;width:320px;max-width:90vw;text-align:center}
  .lockbox h1{font-size:18px;margin:0 0 4px}.lockbox p{color:var(--muted);font-size:12px;margin:0 0 18px}
  .lockbox input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:11px;margin-bottom:10px;text-align:center}
  .lockbox button{width:100%}.lockerr{color:var(--danger);font-size:12px;height:16px;margin-top:6px}
  @media(max-width:820px){
    .desktop-table{display:none}
    .cards{display:none}
    .mrows{display:block}
    .title{font-size:18px}
    .stat .val{font-size:20px}
    button,.who,.budgetsel{padding:9px 12px}
    .catrow .nm{min-width:110px}
  }
</style>
</head>
<body>

<div id="lock"><div class="lockbox">
  <h1>&#128274; Home Expense Tracker</h1>
  <p>Enter your passcode.<br><span style="font-size:11px">View or edit access depends on the code.</span></p>
  <input id="pass" type="password" placeholder="Passcode" onkeydown="if(event.key==='Enter')unlock()">
  <button class="primary" onclick="unlock()">Unlock</button>
  <div class="lockerr" id="lockerr"></div>
</div></div>

<header>
  <div class="title">&#127968; Home Expense Tracker</div>
  <div class="sub" id="subline">Every payment in one place &middot; partial &amp; installment plans</div>
  <div class="toolbar">
    <select class="budgetsel" id="budgetsel" onchange="switchBudget(this.value)"></select>
    <button class="editonly" onclick="addBudget()">&#65291; Budget</button>
    <button class="editonly" onclick="renameBudget()">&#9998;</button>
    <button class="danger editonly" onclick="deleteBudget()">&#128465;</button>
    <button class="editonly" id="typeBtn" onclick="toggleBudgetType()" title="Mark this budget as Spending or Loan/Funding">&#127974; Type</button>
    <span style="flex:1"></span>
    <input id="who" class="who editonly" placeholder="Your name (for log)">
    <button class="primary editonly" onclick="save()">&#128190; Save</button>
    <button onclick="doExportJSON()">JSON</button>
    <button onclick="doExportExcel()">&#128202; Excel</button>
    <button class="editonly" onclick="document.getElementById('imp').click()">&#11014;&#65039;</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="doImport(event)">
    <button onclick="showLog()">&#128339; Log</button>
    <button onclick="reloadData()" title="Re-pull data.json from the repo">&#128260; Reload</button>
    <button onclick="window.print()">&#128424;&#65039;</button>
    <button id="dljson" class="editonly" onclick="downloadData()" title="Download data.json to upload to GitHub">&#11015;&#65039; data.json</button>
    <button class="danger editonly" onclick="clearAll()">Clear</button>
    <button id="themeBtn" onclick="toggleTheme()" title="Switch light/dark">&#9790;</button>
    <button class="danger" onclick="lock()">Lock</button>
  </div>
</header>

<div class="wrap" id="app"></div>
<div class="flash" id="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var VIEW_PASS="Shree";
var EDIT_PASS="Shree1111";
var role='view'; /* 'view' or 'edit' */
function canEdit(){return role==='edit';}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);var b=document.getElementById('themeBtn');if(b)b.innerHTML=(t==='light')?'\u2600':'\u263E';}
function toggleTheme(){var cur=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';var next=cur==='light'?'dark':'light';localStorage.setItem('het_theme',next);applyTheme(next);}
applyTheme(localStorage.getItem('het_theme')||'dark');
var RS=function(n){return '\u20B9'+(Math.round(+n||0)).toLocaleString('en-IN');};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso){if(!iso)return '';var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso);if(!m)return iso;return m[3]+'-'+MON[(+m[2])-1]+'-'+m[1];}
function parseDate(str){str=(str||'').trim();var m=/^(\d{1,2})[- \/]([A-Za-z]{3,})[- \/](\d{4})$/.exec(str);if(m){var mi=-1;for(var j=0;j<12;j++){if(MON[j].toLowerCase()===m[2].slice(0,3).toLowerCase()){mi=j;break;}}if(mi>=0)return m[3]+'-'+String(mi+1).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');}m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(str);if(m)return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');return str;}

var PALETTE=['#6ea8fe','#c58af9','#4fd1c5','#e5883a','#e35d8a','#8ad48a','#f7c948','#7f9cf5','#f78da7','#63b3ed','#b794f4','#68d391'];

/* ---- installment model ----
   row: cat, item, amt(total), paid(paidSoFar for non-installment), date,
        inst:{on:bool, per:perInstallmentAmount, count:totalInstallments, done:installmentsPaid}
   For installment rows: total = per*count (auto), paidSoFar = per*done. */
function isInst(r){return r.inst&&r.inst.on;}
function rowTotal(r){return isInst(r)?((+r.inst.per||0)*(+r.inst.count||0)):(+r.amt||0);}
function rowPaid(r){return isInst(r)?((+r.inst.per||0)*(+r.inst.done||0)):Math.min(+r.paid||0,+r.amt||0);}
function statusOf(r){var p=rowPaid(r),a=rowTotal(r);if(a<=0)return 'Pending';if(p<=0)return 'Pending';if(p>=a)return 'Paid';return 'Partial';}
function remainOf(r){return Math.max(0,rowTotal(r)-rowPaid(r));}

function defaultCats(){return[
  {id:'Interior Work',color:'#6ea8fe'},{id:'Kitchen',color:'#c58af9'},
  {id:'Furniture & Items',color:'#4fd1c5'},{id:'Rented Flat',color:'#e5883a'},
  {id:'Appliances',color:'#e35d8a'},{id:'Installment',color:'#f7c948'}
];}
function seedRows(){return[
  {cat:'Interior Work',item:'Interior work \u2013 advance (68.89%)',amt:475000,paid:475000,date:'2026-05-15'},
  {cat:'Interior Work',item:'Interior work \u2013 after 50% done (25%)',amt:180000,paid:180000,date:'2026-05-29'},
  {cat:'Interior Work',item:'Interior work \u2013 final (5%)',amt:34504,paid:0,date:'2026-06-15'},
  {cat:'Kitchen',item:'Kitchen \u2013 60% to start work',amt:360000,paid:0,date:'2026-07-03'},
  {cat:'Kitchen',item:'Kitchen \u2013 35% at 50% complete',amt:210000,paid:0,date:'2026-07-31'},
  {cat:'Kitchen',item:'Kitchen \u2013 5% on completion',amt:30000,paid:0,date:'2026-08-31'},
  {cat:'Furniture & Items',item:'Sofa (advance + 2nd)',amt:70000,paid:35000,date:'2026-06-01'},
  {cat:'Furniture & Items',item:'Sofa cushion',amt:25000,paid:0,date:'2026-06-20'},
  {cat:'Furniture & Items',item:'Temple',amt:66500,paid:0,date:'2026-06-30'},
  {cat:'Furniture & Items',item:'Table',amt:21500,paid:0,date:'2026-06-30'},
  {cat:'Furniture & Items',item:'Bed mattress',amt:30000,paid:0,date:'2026-06-25'},
  {cat:'Rented Flat',item:'Rented flat \u2013 one month',amt:22000,paid:0,date:'2026-06-20'},
  {cat:'Appliances',item:'Air conditioner',amt:15000,paid:0,date:'2026-07-10'},
  {cat:'Appliances',item:'Home theater',amt:3000,paid:0,date:'2026-07-10'}
];}

var STORE='home_expense_tracker_v3';
var DATA_URL='./data.json';
function builtinStore(){return {active:'Home Interior',budgets:{'Home Interior':{rows:seedRows(),cats:defaultCats(),log:[]}}};}
function loadStore(){
  /* Placeholder until fetchData() pulls the repo's data.json (the source of truth).
     We do NOT read localStorage here anymore, so a stale local copy can't mask the repo. */
  return builtinStore();
}
var store=loadStore();
var dataStatus='';var dataStamp='';
function normalizeStore(st){
  if(st&&st.store&&st.store.budgets)st=st.store; /* accept JSON-export wrapper {store,exportedBy,at} */
  if(!st||!st.budgets)return null;
  if(!st.budgets[st.active])st.active=Object.keys(st.budgets)[0];
  for(var bn in st.budgets){if(!st.budgets.hasOwnProperty(bn))continue;var b=st.budgets[bn];(b.cats||[]).forEach(function(c){if(c.id==='Installation')c.id='Installment';});(b.rows||[]).forEach(function(r){if(r.cat==='Installation')r.cat='Installment';});if(!b.log)b.log=[];if(!b.cats)b.cats=defaultCats();if(b.type!=='loan')b.type='spending';}
  return st;
}
function fetchData(){
  var url=DATA_URL+'?v='+Date.now();
  return fetch(url,{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('NET: HTTP '+r.status+' (file not found at '+DATA_URL+')');
    return r.text().then(function(txt){
      var j;
      try{j=JSON.parse(txt);}catch(pe){throw new Error('PARSE: data.json is not valid JSON \u2014 '+pe.message);}
      var st=normalizeStore(j);
      if(!st)throw new Error('SHAPE: data.json loaded but has no "budgets" \u2014 wrong file structure');
      store=st;store.active=ALL;dataStatus='loaded';dataStamp=new Date().toLocaleTimeString();dataErr='';
    });

function R(bn){return bn?store.budgets[bn].rows:rows();}
function guard(){if(!canEdit()){flash('View-only \u2014 sign in with the edit passcode');return false;}return true;}
function recordIn(bn,what){var b=bn?store.budgets[bn]:cur();b.log.unshift({who:who(),what:what,when:new Date().toISOString()});if(b.log.length>500)b.log.length=500;persist();}
function edit(i,field,el,bn){
  if(!guard())return;
  var arr=R(bn);
  var raw;if(field==='amt'||field==='paid')raw=(+el.value.replace(/[^0-9.-]/g,'')||0);else if(field==='date')raw=parseDate(el.value);else raw=el.value;
  var old=arr[i][field];if(String(old)===String(raw))return;
  if(field==='paid'){var a=+arr[i].amt||0;if(raw>a)raw=a;if(raw<0)raw=0;}
  arr[i][field]=raw;
  var disp=(field==='amt'||field==='paid')?RS(old)+' \u2192 '+RS(raw):field==='date'?('"'+fmtDate(old)+'" \u2192 "'+fmtDate(raw)+'"'):('"'+old+'" \u2192 "'+raw+'"');
  recordIn(bn,'changed '+(field==='paid'?'paid':field)+' of "'+arr[i].item+'" \u2014 '+disp);persist();render();
}
function editInst(i,field,el,bn){if(!guard())return;var r=R(bn)[i];if(!r.inst)r.inst={on:true,per:0,count:0,done:0};var raw=(+el.value.replace(/[^0-9.-]/g,'')||0);if(field==='done'){if(raw<0)raw=0;if(raw>(+r.inst.count||0))raw=+r.inst.count||0;}r.inst[field]=raw;recordIn(bn,'updated installment ('+field+') for "'+r.item+'"');persist();render();}
function toggleInst(i,bn){if(!guard())return;var r=R(bn)[i];if(!r.inst)r.inst={on:false,per:0,count:0,done:0};r.inst.on=!r.inst.on;recordIn(bn,(r.inst.on?'enabled':'disabled')+' installment plan for "'+r.item+'"');persist();render();}
function instStep(i,d,bn){if(!guard())return;var r=R(bn)[i];if(!r.inst)return;var nd=(+r.inst.done||0)+d;if(nd<0)nd=0;if(nd>(+r.inst.count||0))nd=+r.inst.count||0;r.inst.done=nd;recordIn(bn,'installments for "'+r.item+'" now '+nd+' of '+(r.inst.count||0)+' paid');persist();render();}
function markPaid(i,bn){if(!guard())return;var r=R(bn)[i];if(isInst(r)){r.inst.done=+r.inst.count||0;}else{r.paid=+r.amt||0;}recordIn(bn,'marked "'+r.item+'" fully Paid');persist();render();}
function markUnpaid(i,bn){if(!guard())return;var r=R(bn)[i];if(isInst(r)){r.inst.done=0;}else{r.paid=0;}recordIn(bn,'reset "'+r.item+'" to Pending');persist();render();}

function delRow(i,bn){if(!guard())return;var arr=R(bn);recordIn(bn,'deleted "'+arr[i].item+'"');arr.splice(i,1);persist();render();}

function moveRow(i,dir,bn){if(!guard())return;var arr=R(bn);var j=i+dir;if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t;recordIn(bn,'moved "'+arr[j].item+'"');persist();render();}

function renderAll(app){
  var spendRows=[],loanRows=[];
  for(var bn in store.budgets){if(!store.budgets.hasOwnProperty(bn))continue;var isLoan=budgetType(bn)==='loan';store.budgets[bn].rows.forEach(function(r){(isLoan?loanRows:spendRows).push(r);});}

  var projPaid=spendRows.reduce(function(x,r){return x+rowPaid(r);},0);
  var spendOwed=projCost-projPaid;
  var loanOwed=loanRows.reduce(function(x,r){return x+(rowTotal(r)-rowPaid(r));},0);
  var totalOwed=spendOwed+loanOwed;

    '<div class="stat pend"><div class="lbl">Total Still Owed'+(hasLoan?' (incl. loans)':'')+'</div><div class="val">'+RS(totalOwed)+'</div></div>'+

        '<span class="dot" style="background:'+col+'"></span>'+
        '<span class="bname">'+bn+'</span>'+
        (isLoan?'<span class="loanbadge">Loan / Funding</span>':'')+
        '<span class="bcount">'+br.length+' item'+(br.length===1?'':'s')+'</span>'+
        '<span style="flex:1"></span>'+
        '<span class="bmini"><span class="track" style="width:120px"><span style="width:'+cpct+'%;background:'+col+'"></span></span></span>'+
        '<span class="bamt">'+RS(cp)+' / '+RS(ct)+'</span>'+
      '</div>';
    s+='<div class="bcardstats">'+
        '<div class="stat"><div class="lbl">'+(isLoan?'Loan Amount':'Total Cost')+'</div><div class="val">'+RS(ct)+'</div></div>'+

        '<div class="stat"><div class="lbl">Progress</div><div class="val">'+cpct+'%</div><div class="bar"><span style="width:'+cpct+'%;background:var(--paid)"></span><span style="width:'+(100-cpct)+'%;background:var(--pendbg)"></span></div></div>'+
      '</div>';
    s+='<div class="bcardact"><button onclick="event.stopPropagation();switchBudget(\''+bnEsc(bn)+'\')"><span>Open '+bn+'</span> \u2192</button>'+
       '<button onclick="event.stopPropagation();toggleCard(\''+bnEsc(bn)+'\')">'+(open?'Hide items \u25B2':'Show items \u25BC')+'</button></div>';
    if(open){

function moneyInInline(i,field,val){return '<span class="moneywrap" style="display:inline-block;width:100px"><input class="cell num" value="'+val+'" onchange="editInst('+i+',\''+field+'\',this)"></span>';}
if(sessionStorage.getItem('het_role')){document.getElementById('app').innerHTML='<div class="empty">Loading data\u2026</div>';fetchData().then(function(){render();});}
</script>
